# Blackout Secure — Repo About box sync (post-release)
#
# Fires AFTER the launchpad publishes a GitHub Release (the launchpad
# itself lives at .github/workflows/bos-launchpad-marketplace.yml and
# delegates to blackoutsecure/bos-automation-hub's release-promote ->
# github-release reusable chain). At that point the post-promote tree
# is already on `main` and the release tag points at the promoted
# commit, so this workflow can checkout the released ref and pull the
# README to seed the About box.
#
# Why a separate workflow rather than wiring this into the hub
# launchpad: the launchpad reusable is shared across the Marketplace
# fleet, and About-box sync is opt-in per kit (each kit picks its
# own homepage URL + topics fallback + show_releases/deployments
# widgets). Adding it as a kit-local workflow keeps the launchpad
# generic; the same pattern lives in bos-marketplace-kit's own
# release.yml (`repo-metadata` job) and may eventually be promoted
# to the hub once 2+ kits share the same call-site.
#
# Composite source-of-truth: this kit currently ships its own copy
# of `.github/actions/repo-metadata/` (duplicated from bos-marketplace-
# kit at parity, May 2026). The duplicate is intentional and minimal-
# scope: keeps this kit self-contained and avoids cross-repo
# `uses:` coupling on the marketplace-kit's `dev` branch. When a
# third kit adopts the same sync, move the composite to
# `bos-automation-hub/.github/actions/repo-metadata/` and switch both
# call sites to `uses: blackoutsecure/bos-automation-hub/.github/actions/repo-metadata@<sha>`.
#
# What the composite does:
#   - PATCH /repos/{owner}/{repo}  -> description + homepage
#   - PUT   /repos/{owner}/{repo}/topics -> topic list
#   - Optional AI rewrite of description via GitHub Models
#     (`models: read`); falls back deterministically to the README
#     lead paragraph when the AI call fails.
#
# Tokens: both endpoints above require `Administration: write`. The
# default `GITHUB_TOKEN` is rejected on those endpoints even with
# `contents: write`. Resolution order:
#   1. `secrets.REPO_ADMIN_PAT` — isolated blast radius (Admin-only PAT)
#   2. `secrets.RELEASE_PAT`    — single-PAT path used for release pushes
# When neither is set this workflow logs a skip and exits cleanly so
# the release is never blocked on metadata refresh.
name: Repo metadata sync

"on":
  # Auto-fire whenever the launchpad publishes a release. The
  # `published` activity type covers both first-time publishes and
  # republishes of a draft, which is exactly the moment the public
  # tag + README are stable on `main`.
  release:
    types: [published]
  # Manual re-sync against `main` for ops cases (refresh the About
  # box without cutting a release — e.g. after a homepage change in
  # the README or a manual topic correction in the UI that should be
  # codified back into the kit's defaults).
  workflow_dispatch: {}

concurrency:
  # Serialize across whichever ref triggered (release tag or main),
  # so a manual dispatch fired during a release-published run waits
  # rather than racing PATCH/PUT against /repos and /topics.
  group: repo-metadata-sync-${{ github.repository }}
  cancel-in-progress: false

# Workflow-level permissions are the minimum needed by the composite
# itself. The Administration:write surface comes from the PAT
# resolved at step time — never from GITHUB_TOKEN.
permissions:
  contents: read
  models: read

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — validate `vars.DEFAULT_RUNNER` once before any
  # downstream job evaluates its `runs-on:` expression. Fails fast
  # with a clear annotation when the variable is missing or
  # malformed, instead of leaving jobs queued indefinitely against
  # an unmatched label. Runs on `ubuntu-latest` because the
  # validator must run on a runner that is always present.
  # Mirrors `tests.yml` / the hub-side convention.
  # ---------------------------------------------------------------------------
  preflight-runner-config:
    name: Preflight (runner config)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: blackoutsecure/bos-automation-hub/.github/actions/shared/preflight-runner-config@main
        with:
          default_runner: ${{ vars.DEFAULT_RUNNER }}

  sync:
    name: Sync repo About box
    needs: preflight-runner-config
    # Resolves `vars.DEFAULT_RUNNER` (bare label or JSON-array
    # string). Both presence and shape are enforced by the preflight
    # job above, so this expression has no fallback.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER, '[') && vars.DEFAULT_RUNNER || format('"{0}"', vars.DEFAULT_RUNNER)) }}
    timeout-minutes: 5
    permissions:
      # `contents: read` for the checkout of the released tree (so
      # the composite reads the README that landed on `main`, not
      # the dev tree). `models: read` for the GitHub Models AI
      # rewrite of the description and topic generation. The
      # composite falls back deterministically to the raw README
      # seed if the AI call fails, so absence of `models: read`
      # degrades gracefully (with a `::warning::`).
      contents: read
      models: read
    steps:
      # ----------------------------------------------------------------
      # Token resolution — see the workflow-level header for the
      # full rationale. We resolve OUT OF the secrets context here
      # (not at workflow level) so the resolution outcome is visible
      # in the step summary and so the composite call below can
      # gate on `has_pat` without consuming a PAT it cannot use.
      # ----------------------------------------------------------------
      - id: token-check
        name: Resolve metadata sync token
        env:
          HAS_PAT: ${{ (secrets.REPO_ADMIN_PAT != '' || secrets.RELEASE_PAT != '') && 'true' || 'false' }}
          PAT_SOURCE: ${{ secrets.REPO_ADMIN_PAT != '' && 'REPO_ADMIN_PAT' || (secrets.RELEASE_PAT != '' && 'RELEASE_PAT' || 'none') }}
        run: |
          set -euo pipefail
          if [ "${HAS_PAT}" != "true" ]; then
            {
              echo "## Repo metadata sync"
              echo ""
              echo "Skipped — neither \`secrets.REPO_ADMIN_PAT\` nor \`secrets.RELEASE_PAT\` is configured."
              echo ""
              echo "The release published successfully; the public \`About\` box was not refreshed."
              echo ""
              echo "To enable post-release metadata sync, provision a PAT that grants Administration writes on this repo and add it as the \`RELEASE_PAT\` repository secret (single-PAT path) — or as the \`REPO_ADMIN_PAT\` secret when you specifically want the metadata sync's blast radius separated from the release push."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::notice title=Repo metadata sync skipped::No metadata-sync PAT configured (neither REPO_ADMIN_PAT nor RELEASE_PAT); release succeeded but the public About box was not refreshed."
          else
            echo "::notice title=Repo metadata sync token::Using \`secrets.${PAT_SOURCE}\` for repo-metadata PATCH/PUT calls."
          fi
          echo "has_pat=${HAS_PAT}" >> "${GITHUB_OUTPUT}"

      - if: steps.token-check.outputs.has_pat == 'true'
        name: Checkout released tree
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # For `release: published` the tag name resolves to the
          # post-promote main commit (the launchpad tags `main`).
          # For `workflow_dispatch` we re-sync against the current
          # `main` tree explicitly so a manual dispatch does not
          # accidentally read the calling workflow's source ref.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
          persist-credentials: false

      - if: steps.token-check.outputs.has_pat == 'true'
        id: sync
        name: Sync About box (description / topics / widgets)
        uses: ./.github/actions/repo-metadata
        with:
          github_token: ${{ secrets.REPO_ADMIN_PAT || secrets.RELEASE_PAT }}
          # description: omitted — the composite rewrites the README
          # lead paragraph via GitHub Models (falls back to the raw
          # README seed when the AI call fails).
          # Marketplace listing IS the canonical homepage for this
          # kit -- pin it explicitly so the About box always points
          # at the current published listing.
          homepage: 'https://github.com/marketplace/actions/blackout-secure-code-scanning-kit'
          generate_topics: 'true'
          # Domain-appropriate fallback topics for the code-scanning
          # kit. Used by the composite when AI topic generation is
          # disabled or fails. The composite caps at `max_topics`
          # (default 20) and de-duplicates against existing topics.
          topics_fallback: 'github-actions code-scanning security sarif posture-audit gitleaks actionlint shellcheck composite-action devsecops github-advanced-security'
          # Defaults already match a release artefact:
          #   show_releases=true, show_deployments=false, show_packages=false.

      - if: ${{ always() && steps.sync.conclusion != 'skipped' }}
        name: Write repo-metadata summary
        env:
          REPO:               ${{ github.repository }}
          SYNC_OUTCOME:       ${{ steps.sync.outcome }}
          APPLIED:            ${{ steps.sync.outputs.applied }}
          DESCRIPTION:        ${{ steps.sync.outputs.description }}
          DESCRIPTION_SOURCE: ${{ steps.sync.outputs.description_source }}
          HOMEPAGE:           ${{ steps.sync.outputs.homepage }}
          TOPICS:             ${{ steps.sync.outputs.topics }}
          TOPICS_SOURCE:      ${{ steps.sync.outputs.topics_source }}
          AI_USED:            ${{ steps.sync.outputs.ai_used }}
        run: |
          set -euo pipefail

          # Render the outcome row icon. `failure` is the only case
          # where we want a visible cross; `success` and the soft
          # applied=false path both render as a check, with the
          # applied flag carrying the "nothing actually changed"
          # signal in its own cell.
          case "${SYNC_OUTCOME}" in
            success) icon=':white_check_mark:' ;;
            failure) icon=':x:' ;;
            *)       icon=':grey_question:' ;;
          esac

          # Topics list -- render as inline-code chips when present.
          topics_cell="_(unchanged)_"
          if [ -n "${TOPICS}" ]; then
            topics_cell=""
            for t in ${TOPICS}; do
              topics_cell="${topics_cell} \`${t}\`"
            done
            topics_cell="${topics_cell# }"
          fi

          {
            echo "## Repo metadata sync"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Outcome | ${icon} \`${SYNC_OUTCOME}\` |"
            echo "| Applied | \`${APPLIED:-false}\` |"
            echo "| Description source | \`${DESCRIPTION_SOURCE:-n/a}\` |"
            echo "| AI used | \`${AI_USED:-false}\` |"
            echo "| Topics source | \`${TOPICS_SOURCE:-n/a}\` |"
            echo "| Homepage | ${HOMEPAGE:-_(unchanged)_} |"
            echo "| Topics | ${topics_cell} |"
            echo "| Repo About page | https://github.com/${REPO} |"
            echo ""
            if [ -n "${DESCRIPTION}" ]; then
              echo "<details><summary>Applied description</summary>"
              echo ""
              echo "\`\`\`"
              printf '%s\n' "${DESCRIPTION}"
              echo "\`\`\`"
              echo ""
              echo "</details>"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
