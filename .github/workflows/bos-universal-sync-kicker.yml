# Blackout Secure universal sync kicker (hub-managed).
# Customize via `.github/bos-universal-config.json`, not this file.
# Schema docs: https://github.com/blackoutsecure/bos-automation-hub
name: Blackout Secure universal sync (kicker)
run-name: >-
  Blackout Secure universal sync / ${{
    github.event_name == 'workflow_dispatch'
      && format('manual ({0})', inputs.mode)
      || github.event_name == 'schedule'
      && 'scheduled'
      || 'config changed'
  }}

"on":
  schedule:
    - cron: '29 14 * * 1'
  push:
    paths:
      - '.github/bos-universal-config.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: commit drift back, or check-only'
        type: choice
        options: [commit, check]
        default: commit

permissions:
  contents: read

jobs:
  resolve-target:
    name: Resolve target hub ref
    # Resolve runner from org-shared `vars.DEFAULT_RUNNER` when set,
    # supporting both bare label and JSON-array formats. Fallback to
    # `ubuntu-latest` if the variable is not defined in the consumer.
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 1
    if: >-
      !cancelled()
      && (
        github.event_name != 'push'
        || github.ref_name == github.event.repository.default_branch
      )
    outputs:
      ref: ${{ steps.target-ref.outputs.ref }}
    steps:
      # `uses:` refs cannot be dynamic, so resolve which hub branch this
      # run targets here and pick the matching static-ref job below.
      - name: Resolve target hub ref
        id: target-ref
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref="main"
          [ "${REF_NAME}" = "dev" ] && ref="dev"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

  sync:
    name: Sync managed files (${{ inputs.mode || 'commit' }})
    needs: resolve-target
    if: needs.resolve-target.result == 'success'
    permissions:
      contents: write
    runs-on: ${{ fromJSON(startsWith(vars.DEFAULT_RUNNER || 'ubuntu-latest', '[') && (vars.DEFAULT_RUNNER || 'ubuntu-latest') || format('"{0}"', vars.DEFAULT_RUNNER || 'ubuntu-latest')) }}
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout hub global config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blackoutsecure/bos-automation-hub
          ref: dev
          path: .hub-automation
          sparse-checkout: .github/blackout-secure-managed-file-sync-global-config.json
          persist-credentials: false

      - name: Sync managed files
        id: sync
        uses: blackoutsecure/bos-managed-file-sync-action@v1
        with:
          use_global_config: 'true'
          global_config_path: ${{ github.workspace }}/.hub-automation/.github/blackout-secure-managed-file-sync-global-config.json
          dry_run: ${{ (inputs.mode || 'commit') == 'check' }}
          fail_on_drift: ${{ (inputs.mode || 'commit') == 'check' }}
          show_diff: 'true'

      - name: Commit and push
        if: >-
          (inputs.mode || 'commit') == 'commit'
          && steps.sync.outputs.changed == 'true'
        uses: blackoutsecure/bos-automation-hub/.github/actions/shared/commit-and-push@main
        with:
          files: ${{ steps.sync.outputs.changed_files }}
          message: 'chore: sync managed files'
