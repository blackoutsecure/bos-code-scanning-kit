# Self-scan: run THE kit's own composite action against the kit's
# own repo. This is the canonical dogfood — if the kit can't scan
# itself cleanly, the kit doesn't ship.
#
# Notes on choices:
#   * `uses: ./` runs the version of `action.yml` on the current
#     branch (NOT a tagged release). That's exactly what we want: a
#     PR that breaks the action breaks this workflow.
#   * `fail_on: never` lets findings surface as a SARIF upload to
#     Code Scanning without blocking the workflow during the first
#     few cycles. Flip to `fail` once the baseline is clean.
#   * The matrix covers BOTH GitHub-hosted x64 and arm64 runners
#     so we validate the RUNNER_ARCH branching baked into the scanner
#     downloads (added in the Phase 4 refactor). Without two arches,
#     an arm64 regression would only be caught by a downstream
#     consumer. Dedicated hosted labels keep this required producer
#     check independent of optional self-hosted runner availability.
#   * Push and pull-request runs remain direct tests of the triggering
#     commit. Manual dispatch is authorized by the read-only Gatekeeper
#     App before the Gatewall credential can be used.
#
# Lives on `dev` only — never promoted (Marketplace publishing
# prohibits workflows on the default branch).
name: Self-scan · dogfood action against own repo

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Override fail_on (fail|never)."
        required: false
        type: choice
        default: "never"
        options: ["never", "fail"]
      advanced_scanning:
        description: >-
          Force advanced posture probes on or off. Leave unchecked to
          auto-enable when the Gatewall App is configured.
        required: false
        type: boolean
        default: false
      require_pat:
        description: "Fail if advanced scanning is requested but the Gatewall App token is unavailable. Retained under its legacy input name for dispatch compatibility."
        required: false
        type: boolean
        default: false
      http_timeout:
        description: "Per-request HTTP timeout (seconds) for posture probes. Default 20. Bump to ride out GH API latency or slow self-hosted egress."
        required: false
        type: string
        default: "20"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: self-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize manual dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Mint authorization token
        id: authz-token
        if: github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GATEKEEPER_APP_ID }}
          private-key: ${{ secrets.GATEKEEPER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-members: read

      - name: Check dispatcher authorization
        uses: blackoutsecure/bos-workflow-gatekeeper@eae1fdd8ab731e72bf890fdb7c1504415d12d88c # v1.0.2
        with:
          actor: ${{ github.triggering_actor || github.actor }}
          organization: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          event_name: ${{ github.event_name }}
          allow_org_admin: true
          fail_closed: true
          token: ${{ steps.authz-token.outputs.token }}

  self-scan:
    name: Self-scan (${{ matrix.arch }})
    needs: authorize
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Mint security audit token
        id: security-app
        if: github.event_name != 'pull_request' && vars.GATEWALL_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GATEWALL_APP_ID }}
          private-key: ${{ secrets.GATEWALL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-administration: read
          permission-contents: read
          permission-secret-scanning-alerts: read
          permission-security-events: write
          permission-vulnerability-alerts: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mode
        name: Resolve scan mode
        env:
          INPUT_ADVANCED: ${{ github.event_name == 'workflow_dispatch' && inputs.advanced_scanning && 'true' || '' }}
          INPUT_REQUIRE_PAT: ${{ github.event_name == 'workflow_dispatch' && inputs.require_pat && 'true' || '' }}
          VAR_ADVANCED: ${{ vars['BOS_SCAN_ADVANCED'] }}
          VAR_REQUIRE_PAT: ${{ vars['BOS_SCAN_REQUIRE_PAT'] }}
          HAS_APP: ${{ steps.security-app.outputs.token != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          is_true() {
            case "${1:-}" in
              true|TRUE|True|1|yes|YES|on|ON) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Dogfood auto-enable: when Gatewall is present, the kit's own
          # trusted push/manual self-scan ALWAYS exercises
          # the advanced posture path (PS001 code-scanning default-
          # setup, PS002 secret-scanning enablement, PS003 Dependabot
          # alerts enablement). This is the canonical end-to-end test
          # for the Gatewall wiring — if the kit can't probe its
          # own GHAS settings cleanly, consumers won't either. Explicit
          # dispatch input / repo var still override (e.g. to force a
          # fallback-path test by passing `advanced_scanning: false`).
          advanced_requested=false
          if [ -n "${INPUT_ADVANCED}" ]; then
            advanced_requested=true
          elif is_true "${VAR_ADVANCED}"; then
            advanced_requested=true
          elif [ "${HAS_APP}" = "true" ]; then
            advanced_requested=true
          fi

          require_pat=false
          if [ -n "${INPUT_REQUIRE_PAT}" ]; then
            require_pat=true
          elif is_true "${VAR_REQUIRE_PAT}"; then
            require_pat=true
          fi

          if [ "${advanced_requested}" = "true" ] && [ "${HAS_APP}" != "true" ] && [ "${require_pat}" = "true" ]; then
            echo "::error::Advanced scanning was requested, but the Gatewall App token is unavailable."
            exit 1
          fi

          if [ "${advanced_requested}" = "true" ] && [ "${HAS_APP}" != "true" ]; then
            echo "::warning::Advanced scanning requested without a security-audit App token. Falling back to GITHUB_TOKEN."
          fi

          echo "advanced_requested=${advanced_requested}" >> "${GITHUB_OUTPUT}"
      - id: scan
        uses: ./
        with:
          enable_posture: "true"
          enable_scanners: "true"
          enable_upload: "true"
          fail_on: ${{ inputs.fail_on || 'never' }}
          http_timeout: ${{ inputs.http_timeout || '20' }}
          github_token: ${{ steps.security-app.outputs.token || github.token }}
      - name: Show outputs
        if: always()
        env:
          SARIF_PATH: ${{ steps.scan.outputs.sarif_path }}
          POSTURE_FAILURES: ${{ steps.scan.outputs.posture_failures }}
        run: |
          set -euo pipefail
          echo "sarif_path=${SARIF_PATH}"
          echo "posture_failures=${POSTURE_FAILURES}"
      - name: Upload SARIF artifact for inspection
        if: always() && steps.scan.outputs.sarif_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bos-scan-sarif-${{ matrix.arch }}
          path: ${{ steps.scan.outputs.sarif_path }}
          if-no-files-found: warn
          retention-days: 14
