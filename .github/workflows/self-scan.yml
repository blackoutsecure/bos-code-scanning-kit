# Self-scan: run THE kit's own composite action against the kit's
# own repo. This is the canonical dogfood — if the kit can't scan
# itself cleanly, the kit doesn't ship.
#
# Notes on choices:
#   * `uses: ./` runs the version of `action.yml` on the current
#     branch (NOT a tagged release). That's exactly what we want: a
#     PR that breaks the action breaks this workflow.
#   * `fail_on: never` lets findings surface as a SARIF upload to
#     Code Scanning without blocking the workflow during the first
#     few cycles. Flip to `fail` once the baseline is clean.
#   * The matrix covers BOTH `vars.RUNNER_X64` and `vars.RUNNER_ARM64`
#     so we validate the RUNNER_ARCH branching baked into the scanner
#     downloads (added in the Phase 4 refactor). Without two arches,
#     an arm64 regression would only be caught by a downstream
#     consumer. Each leg uses the org's preferred per-arch runner —
#     bare GitHub-hosted labels (`ubuntu-latest`, `ubuntu-24.04-arm`)
#     or JSON-array self-hosted labels both work, normalised by the
#     same resolver expression used everywhere else (see hub README,
#     "Runner resolution"). Both vars are validated by
#     `preflight-runner-config` before the matrix is consumed.
#
# Lives on `dev` only — never promoted (Marketplace publishing
# prohibits workflows on the default branch).
name: Self-scan · dogfood action against own repo

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Override fail_on (fail|never)."
        required: false
        type: choice
        default: "never"
        options: ["never", "fail"]
      advanced_scanning:
        description: >-
          Force advanced posture probes (PS001/PS002/PS003) on or off. Leave
          unchecked to auto-enable when `SCANNING_PAT` is present; otherwise
          they stay off. Force-enable fails with `require_pat` when absent.
        required: false
        type: boolean
        default: false
      require_pat:
        description: "Fail if advanced scanning is requested but SCANNING_PAT is not set. Useful for verifying the PAT secret is actually present (instead of silently falling back to GITHUB_TOKEN)."
        required: false
        type: boolean
        default: false
      http_timeout:
        description: "Per-request HTTP timeout (seconds) for posture probes. Default 20. Bump to ride out GH API latency or slow self-hosted egress."
        required: false
        type: string
        default: "20"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: self-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — validate `vars.RUNNER_X64` AND `vars.RUNNER_ARM64` once
  # before the matrix is expanded. Fails fast with a clear annotation
  # when either is missing or malformed, instead of leaving jobs queued
  # indefinitely against an unmatched label. Runs on `ubuntu-latest`
  # because the validator must run on a runner that is always present.
  # `vars.DEFAULT_RUNNER` is NOT required here — this workflow is
  # arch-pinned by design (cross-arch regression coverage).
  # See `blackoutsecure/bos-automation-hub` README ("Runner resolution")
  # for the org-wide convention this mirrors.
  # ---------------------------------------------------------------------------
  preflight-runner-config:
    name: Preflight (runner config)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: blackoutsecure/bos-automation-hub/.github/actions/shared/preflight-runner-config@main
        with:
          # Forward all three vars even though this workflow is arch-pinned
          # and never consumes DEFAULT_RUNNER. Composite actions cannot read
          # `vars.*` directly, so omitting it would print a misleading
          # "empty (not required)" line in the preflight log when the org
          # actually has DEFAULT_RUNNER set. See the action's own docs
          # ("Convention: callers should forward all three runner vars").
          default_runner: ${{ vars.DEFAULT_RUNNER }}
          runner_x64: ${{ vars.RUNNER_X64 }}
          runner_arm64: ${{ vars.RUNNER_ARM64 }}
          require_default_runner: "false"
          require_runner_x64: "true"
          require_runner_arm64: "true"

  self-scan:
    name: Self-scan (${{ matrix.arch }})
    needs: preflight-runner-config
    # Resolves the matrix-supplied runner var (bare label or JSON-array
    # string). Both presence and shape are enforced by
    # `preflight-runner-config`, so this expression has no fallback —
    # see the hub's README ("Runner resolution") for the full rationale.
    runs-on: ${{ fromJSON(startsWith(matrix.runner, '[') && matrix.runner || format('"{0}"', matrix.runner)) }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # `${{ vars.* }}` is substituted at workflow-start (before matrix
        # expansion), so each leg carries a concrete runner spec string
        # by the time the resolver above evaluates it.
        include:
          - arch: x64
            runner: ${{ vars.RUNNER_X64 }}
          - arch: arm64
            runner: ${{ vars.RUNNER_ARM64 }}
    steps:
      - name: Mint security audit token
        id: security-app
        if: vars.GATEWALL_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GATEWALL_APP_ID }}
          private-key: ${{ secrets.GATEWALL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-administration: read
          permission-contents: read
          permission-secret-scanning-alerts: read
          permission-security-events: write
          permission-vulnerability-alerts: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mode
        name: Resolve scan mode
        env:
          INPUT_ADVANCED: ${{ github.event_name == 'workflow_dispatch' && inputs.advanced_scanning && 'true' || '' }}
          INPUT_REQUIRE_PAT: ${{ github.event_name == 'workflow_dispatch' && inputs.require_pat && 'true' || '' }}
          VAR_ADVANCED: ${{ vars['BOS_SCAN_ADVANCED'] }}
          VAR_REQUIRE_PAT: ${{ vars['BOS_SCAN_REQUIRE_PAT'] }}
          HAS_APP: ${{ steps.security-app.outputs.token != '' && 'true' || 'false' }}
          HAS_PAT: ${{ secrets['SCANNING_PAT'] != '' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          is_true() {
            case "${1:-}" in
              true|TRUE|True|1|yes|YES|on|ON) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Dogfood auto-enable: when SCANNING_PAT is present at the
          # repo/org level, the kit's own self-scan ALWAYS exercises
          # the advanced posture path (PS001 code-scanning default-
          # setup, PS002 secret-scanning enablement, PS003 Dependabot
          # alerts enablement). This is the canonical end-to-end test
          # for the SCANNING_PAT wiring — if the kit can't probe its
          # own GHAS settings cleanly, consumers won't either. Explicit
          # dispatch input / repo var still override (e.g. to force a
          # fallback-path test by passing `advanced_scanning: false`).
          advanced_requested=false
          if [ -n "${INPUT_ADVANCED}" ]; then
            advanced_requested=true
          elif is_true "${VAR_ADVANCED}"; then
            advanced_requested=true
          elif [ "${HAS_APP}" = "true" ] || [ "${HAS_PAT}" = "true" ]; then
            advanced_requested=true
          fi

          require_pat=false
          if [ -n "${INPUT_REQUIRE_PAT}" ]; then
            require_pat=true
          elif is_true "${VAR_REQUIRE_PAT}"; then
            require_pat=true
          fi

          use_pat=false
          if [ "${advanced_requested}" = "true" ] && { [ "${HAS_APP}" = "true" ] || [ "${HAS_PAT}" = "true" ]; }; then
            use_pat=true
          fi

          if [ "${advanced_requested}" = "true" ] && [ "${HAS_APP}" != "true" ] && [ "${HAS_PAT}" != "true" ] && [ "${require_pat}" = "true" ]; then
            echo "::error::Advanced scanning was requested, but no security-audit App token or legacy PAT is configured."
            exit 1
          fi

          if [ "${advanced_requested}" = "true" ] && [ "${HAS_APP}" != "true" ] && [ "${HAS_PAT}" != "true" ]; then
            echo "::warning::Advanced scanning requested without a security-audit App token. Falling back to GITHUB_TOKEN."
          fi

          echo "advanced_requested=${advanced_requested}" >> "${GITHUB_OUTPUT}"
          echo "use_pat=${use_pat}" >> "${GITHUB_OUTPUT}"
      - id: scan
        uses: ./
        with:
          enable_posture: "true"
          enable_scanners: "true"
          enable_upload: "true"
          fail_on: ${{ inputs.fail_on || 'never' }}
          http_timeout: ${{ inputs.http_timeout || '20' }}
          github_token: ${{ steps.security-app.outputs.token || (steps.mode.outputs.use_pat == 'true' && secrets['SCANNING_PAT'] || github.token) }}
      - name: Show outputs
        if: always()
        env:
          SARIF_PATH: ${{ steps.scan.outputs.sarif_path }}
          POSTURE_FAILURES: ${{ steps.scan.outputs.posture_failures }}
        run: |
          set -euo pipefail
          echo "sarif_path=${SARIF_PATH}"
          echo "posture_failures=${POSTURE_FAILURES}"
      - name: Upload SARIF artifact for inspection
        if: always() && steps.scan.outputs.sarif_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bos-scan-sarif-${{ matrix.arch }}
          path: ${{ steps.scan.outputs.sarif_path }}
          if-no-files-found: warn
          retention-days: 14
