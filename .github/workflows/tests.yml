# Python CLI tests for bos-code-scanning-kit itself.
#
# Runs on every PR against `dev` and every push to `dev`, and on
# manual `workflow_dispatch` from the Actions tab. Validates:
#   * `scan_kit` imports cleanly and the `bos-scan` console-script
#     entrypoint resolves.
#   * The full pytest suite passes (covers config, posture, detect,
#     sarif merge, and CLI surface).
#   * `ruff check` passes on `src/` + `test/` + `scripts/`.
#   * `action.yml` metadata is in sync with `pyproject.toml`
#     (see `scripts/check_action_sync.py`).
#   * README's `Action inputs` / `Action outputs` tables are in sync
#     with `action.yml` (see `scripts/render_readme_inputs.py`).
#
# Matrix covers every Python in `pyproject.toml::classifiers`
# (3.10 / 3.11 / 3.12) so we catch consumer-side breakage early.
#
# This workflow lives on `dev` only. It is NEVER promoted to `main`
# (Marketplace publishing prohibits workflows on the default branch).
#
# `schedule:` is intentionally absent. GitHub fires scheduled
# workflows only from files present on the default branch, and the
# Marketplace publishing rule keeps `.github/workflows/**` off `main`.
# Use Dependabot (already configured) for action-version drift and
# `workflow_dispatch` for manual sanity runs.
name: Test · Python CLI

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-cli:
    name: Python CLI (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Import + CLI smoke
        run: |
          set -euo pipefail
          python -c "import scan_kit; print(scan_kit.__name__)"
          bos-scan --help
      - name: Ruff
        run: |
          set -euo pipefail
          python -m ruff check src test scripts
      - name: pytest
        run: |
          set -euo pipefail
          python -m pytest -q
      - name: Drift guard — action.yml vs pyproject.toml
        run: python3 scripts/check_action_sync.py
      - name: Drift guard — README tables vs action.yml
        run: python3 scripts/render_readme_inputs.py --check
