# Blackout Secure Marketplace Launchpad caller for a Python composite Action.
#
# Thin (~60-line) event-trigger wrapper around the hub-side reusable
# bos-launchpad-marketplace.yml in blackoutsecure/bos-automation-hub.
#
# All orchestration logic — composing marketplace-action-ci.yml +
# marketplace-repo-guard.yml + release-promote.yml, event routing,
# per-stage permissions — lives in the hub reusable. This file is
# intentionally minimal: subscribe to events, forward context, set
# the one per-repo customization (runtime_artifact_dir).
#
# Per-repo customization: runtime_artifact_dir = 'src'
# (a Python composite Action runtime artifact directory). Auto-appended
# to both the guard's required_paths and the release's allowlist_paths
# by the hub reusable, so a single input drives both protections.
#
# Routing inside the hub reusable:
#
#   pull_request (base = dev)         → ci      stage runs
#   push (branch = dev)               → ci      stage runs (post-merge re-verify)
#   pull_request_target (base = main) → guard   stage runs
#   workflow_dispatch mode=release    → release stage runs
#   workflow_dispatch mode=name-check → ci      stage runs (name-check on)
#
# This file MUST NOT exist on `main` — Marketplace publishing
# requires zero workflow files on the default branch. The hub-side
# release stage's allowlist excludes `.github/workflows/**` by
# design; do not override it.
name: Blackout Secure Marketplace Launchpad

"on":
  pull_request:
    branches: ['dev']
  push:
    branches: ['dev']
  pull_request_target:
    branches: ['main']
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation: `release` (promote dev → main + GH Release) or `name-check` (one-shot Marketplace name availability probe).'
        required: true
        type: choice
        options:
          - release
          - name-check
        default: release
      tag_name:
        description: 'Release tag (SemVer, e.g. v1.2.0). Leave empty to auto-bump the patch of the latest stable tag (or `v0.1.0` for a first release). Pass an explicit tag for minor/major bumps or pre-release suffixes.'
        required: false
        type: string
      dry_run:
        description: 'Dry run — validate + diff, do not push/tag.'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Publish the GitHub Release as a draft.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read
  # The hub reusable declares a nested `security_scan` job that
  # statically requires `security-events: write` + `actions: read`.
  # GitHub validates this cascade at workflow-load time, BEFORE
  # evaluating the job's `if:` gate — so even though this caller
  # sets `enable_security_scan: false` (CodeQL is handled by the
  # standalone `codeql.yml`), these grants MUST still be present
  # or the workflow fails to load with:
  #   The nested job 'security_scan' is requesting
  #   'actions: read, security-events: write', but is only allowed
  #   'actions: none, security-events: none'.
  security-events: write
  actions: read
  # Same cascade rule for the AI changelog: the hub's `release` job
  # -> `release-promote.yml` -> `github-release.yml` publish job
  # statically requests `models: read` so the renderer can call the
  # GitHub Models inference API. The cascade is validated at
  # workflow-load time regardless of `release_ai_changelog` — and
  # we opt this kit IN above, so the grant is required either way.
  models: read

concurrency:
  group: >-
    bos-launchpad-marketplace-${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.number
      || inputs.tag_name
      || github.ref
    }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  launchpad:
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-launchpad-marketplace.yml@main
    permissions:
      contents: write
      pull-requests: read
      # See workflow-level note above — required statically by the
      # hub reusable's `security_scan` nested job even when that
      # job is gated off via `enable_security_scan: false`.
      security-events: write
      actions: read
      # See workflow-level note above — required by the hub
      # reusable's `release` -> `release-promote.yml` ->
      # `github-release.yml` cascade so the AI changelog step can
      # reach the GitHub Models inference API.
      models: read
    with:
      # ----- Event-routing context (forwarded from caller event) -----
      event_name:      ${{ github.event_name }}
      dispatched_mode: ${{ inputs.mode || '' }}
      pr_base_sha:     ${{ github.event.pull_request.base.sha || '' }}
      pr_head_sha:     ${{ github.event.pull_request.head.sha || '' }}

      # ----- Per-repo customization (single source of truth) -----
      runtime_artifact_dir: 'src'

      # CodeQL coverage for this kit is driven by the standalone
      # `.github/workflows/codeql.yml` (calls
      # `blackoutsecure/bos-automation-hub/.github/workflows/bos-launchpad-code-scan.yml@main`
      # directly with `enable_kit_composite: false` \u2014 the producer-kit
      # pattern). We do NOT enable `security_scan` here because that
      # would re-run CodeQL on every dev push, doubling spend with no
      # extra signal, and would defeat the `CQ001` marketplace-kit
      # detector (which only recognises a top-level workflow file
      # referencing `github/codeql-action`, not transitive reusables).
      #
      # `self-scan.yml` separately dogfoods the in-tree `./` composite
      # against this repo's dev source for posture + bundled scanners.
      enable_security_scan: false

      # ----- Community-health files inherited from blackoutsecure/.github
      # CONTRIBUTING.md / SECURITY.md / CODE_OF_CONDUCT.md / SUPPORT.md /
      # issue templates / PR template / FUNDING.yml all live in the org
      # `.github` repo and are inherited from there. Without this
      # override the kit `check` composite would fall back to `either`
      # and treat the missing local CONTRIBUTING.md as a warn.
      community_health_source: 'inherit'

      # ----- Release dispatch inputs (ignored for non-release events) -----
      tag_name:      ${{ inputs.tag_name || '' }}
      dry_run:       ${{ inputs.dry_run || false }}
      release_draft: ${{ inputs.draft || false }}

      # ----- AI-generated changelog in the GitHub Release body -----------
      # Opt-in for this kit specifically (rest of the BlackoutSecure
      # marketplace fleet stays on the bash conventional-commits
      # grouper until each maintainer flips it on).
      #
      # The hub launchpad → release-promote → github-release →
      # render-release-notes chain summarizes commits between the
      # previous tag and `dev` HEAD via the GitHub Models inference
      # API (`openai/gpt-4o-mini` is the default; cheap, fast, very
      # good at conventional-commit grouping). Falls back to a
      # deterministic bash grouping on any AI failure — releases
      # never block on AI availability.
      release_ai_changelog: 'true'

      # ----- Release-time hard gate (non-dry-run release dispatches only) -----
      # Block the dev → main promote + GH Release if any of the three
      # PR-time gates is not green at `dev` HEAD. The launchpad's own
      # `ci` / `security_scan` jobs are skipped on release dispatch (they
      # gate PRs into `dev`, not the dispatch itself), so this preflight
      # is what actually prevents a maintainer from accidentally
      # releasing red code. Dry-runs always bypass this gate so the
      # release pipeline can be previewed against a red branch.
      #
      # Workflows listed here MUST be triggered on `push: dev` so a
      # completed run exists at every commit on `dev`. All three already
      # are — see each file's `on:` block. The gate looks up runs by
      # `head_sha` (exact SHA match), so a release dispatched while CI
      # is still in-progress on the latest dev commit correctly fails.
      require_workflow_success: 'tests.yml,self-scan.yml,codeql.yml'
