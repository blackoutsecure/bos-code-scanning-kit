name: "Blackout Secure Code Scanning Kit"
# MP010: keep <= 125 chars; full feature list lives in README.md.
description: >-
  Run secret/code scanners and posture audits, then upload a unified SARIF log to GitHub Advanced Security.
author: "Blackout Secure"
branding:
  color: "blue"
  icon: "shield"

# Composite Action orchestration:
#
#   detect    → walks the repo and prints a one-line ecosystem summary.
#   posture   → REST-API audit (GHAS toggles, workflow perms, branch
#               protection, required reviews, CODEOWNERS). Emits SARIF.
#   actionlint, gitleaks, shellcheck — always-on / conditional scanners,
#               each producing its own SARIF.
#   merge     → folds every scanner's SARIF + the posture SARIF into
#               one upload-ready artefact.
#   upload    → posts the merged SARIF to GitHub Advanced Security so
#               findings land on the repo Security tab.
#
# Configuration resolves in marketplace, global, then repository order.
# The marketplace baseline ships with the action; global and repo files
# are discovered from the checkout. The inputs below control discovery
# and the small set of operator-level overrides for CI.

inputs:
  # ----- Identification -----
  owner:
    description: "GitHub owner of the repo being scanned. Defaults to the workflow context."
    required: false
    default: ""
  repo:
    description: "GitHub repo name being scanned. Defaults to the workflow context."
    required: false
    default: ""
  use_global_config:
    description: >-
      `auto` loads the organization-level global config when present.
      `true` requires it; `false` disables it.
    required: false
    default: "auto"
  global_config_path:
    description: >-
      Organization-level config path. Loaded automatically when present,
      after marketplace defaults and before the repository config.
    required: false
    default: ".github/blackout-secure-code-scanning-kit-global-config.yml"
  use_marketplace_config:
    description: >-
      `true` (default) applies the bundled marketplace baseline first, then
      layers global/repository config on top. Set `false` to skip the
      bundled baseline entirely and rely solely on your global/repository
      config (falling back to the dataclass defaults for anything unset).
    required: false
    default: "true"
  config:
    description: >-
      Repository config path. Defaults to `.github/bos-universal-config.json`,
      `.github/bos-universal-config.yml`, then legacy `.bos-scan.yml` discovery.
    required: false
    default: ""

  # ----- Authentication -----
  #
  # Standalone caller fallback pattern. Gatekeeper callers should pass a
  # short-lived GitHub App installation token; SCANNING_PAT remains legacy:
  #
  #   - uses: blackoutsecure/bos-code-scanning-kit@v1
  #     with:
  #       github_token: ${{ secrets.SCANNING_PAT || secrets.GITHUB_TOKEN }}
  #
  # Implementation note: action manifest scalars (defaults AND descriptions)
  # cannot contain GitHub expression syntax — the legacy runner manifest
  # parser evaluates such expressions at load time and rejects unknown
  # contexts (e.g. `github.token` resolves only in workflow scope, not action
  # manifest scope). That is why this input's default is the empty string and
  # the `github.token` fallback is applied at the step level instead.
  github_token:
    description: >-
      Token for the posture audit. Prefer a short-lived GitHub App installation
      token with the required read scopes; Gatekeeper mints one automatically.
      Leave blank to use the workflow's built-in GITHUB_TOKEN for baseline
      checks. A scoped `SCANNING_PAT` is supported as a legacy fallback when an
      App cannot be installed. Elevated credentials let the kit verify
      admin-gated controls instead of reporting them as skipped.
    required: false
    default: ""

  # ----- Scope gates (off → skip an entire stage) -----
  enable_posture:
    description: "`true` to run the posture audit step."
    required: false
    default: "true"
  enable_scanners:
    description: "`true` to run the bundled scanners (actionlint / gitleaks / shellcheck)."
    required: false
    default: "true"
  enable_upload:
    description: "`true` to upload the merged SARIF to GitHub Advanced Security."
    required: false
    default: "true"
  category:
    description: >-
      Code Scanning category for the SARIF upload. Override this when a repo
      runs the kit from more than one caller workflow for the same commit
      (e.g. a PR gate AND a release pipeline) so the two uploads don't
      collide under the same category and race/overwrite each other.
    required: false
    default: "bos-code-scanning-kit"

  # ----- Failure policy -----
  fail_on:
    description: >-
      `fail` (default) — exit non-zero if posture has any FAIL findings
      or any scanner reports a result. `never` — collect findings but
      always exit 0 (useful for first-time rollouts).
    required: false
    default: "fail"

  # ----- Tuning -----
  http_timeout:
    description: >-
      Per-request HTTP timeout (seconds) for the posture audit's GitHub
      REST calls. Default `20`. Each probe is independent, so the
      practical upper bound on a posture run is roughly
      `http_timeout` * number-of-probes (~10 on a baseline scan).
      Bump on self-hosted runners with slow egress, or to ride out
      brief GitHub API latency spikes that otherwise surface as
      `PS*** error: HTTP 502` rows. Bare integer string; no unit.
    required: false
    default: "20"

  # ----- Output -----
  sarif_output:
    description: "Path for the merged SARIF artefact."
    required: false
    default: "bos-scan.sarif"

outputs:
  quality_applicability:
    description: >-
      JSON object describing whether Node, Python, and Shell quality gates
      apply to the checked-out repository and why.
    value: ${{ steps.detect.outputs.quality_applicability }}
  sarif_path:
    description: "Path to the merged SARIF file produced by the run."
    value: ${{ steps.merge.outputs.sarif_path }}
  posture_failures:
    description: "Number of FAIL findings from the posture audit."
    value: ${{ steps.posture.outputs.failures }}
  recommendations_path:
    description: "Path to structured posture remediation recommendations."
    value: ${{ steps.posture.outputs.recommendations_path }}
  outcome:
    description: >-
      Severity-tier verdict for the run: `success` (no findings at any
      level), `warn` (only warning/note-level findings — nothing the
      enforcement policy would block on), or `failure` (at least one
      error-level finding from the posture audit or any scanner).
      Reflects severity only — it does NOT change based on `fail_on`,
      so callers can gate pipelines on the verdict independently of
      whether the kit step itself exited non-zero.
    value: ${{ steps.summary.outputs.outcome }}

runs:
  using: composite
  steps:
    # ----- 0. Install the kit itself so `bos-scan` is on PATH ---------
    # SHA pin per Marketplace SC002 hygiene; bump via Dependabot.
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install bos-code-scanning-kit
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --quiet --upgrade pip
        python3 -m pip install --quiet "${GITHUB_ACTION_PATH}"

    # ----- 1. Ecosystem detection ---------------------------------------
    - id: detect
      name: Detect ecosystems
      shell: bash
      run: |
        set -euo pipefail
        detection_json="$(bos-scan detect --root "${GITHUB_WORKSPACE}" --json)"
        printf '%s\n' "${detection_json}"
        quality_json="$(python3 -c 'import json, sys; print(json.dumps(json.loads(sys.argv[1])["quality_applicability"], separators=(",", ":")))' "${detection_json}")"
        {
          echo 'quality_applicability<<__BOS_QUALITY__'
          echo "${quality_json}"
          echo '__BOS_QUALITY__'
        } >> "${GITHUB_OUTPUT}"

    # ----- 2. Posture audit (Python) ------------------------------------
    - id: posture
      name: Posture audit (GHAS / workflows / branches / CODEOWNERS)
      if: inputs.enable_posture == 'true'
      shell: bash
      env:
        GH_OWNER: ${{ inputs.owner || github.repository_owner }}
        GH_REPO: ${{ inputs.repo || github.event.repository.name }}
        GH_USE_GLOBAL_CFG: ${{ inputs.use_global_config }}
        GH_GLOBAL_CFG: ${{ inputs.global_config_path }}
        GH_USE_MARKETPLACE_CFG: ${{ inputs.use_marketplace_config }}
        GH_CFG: ${{ inputs.config }}
        GH_TOKEN: ${{ inputs.github_token || github.token }}
        FAIL_ON: ${{ inputs.fail_on }}
        HTTP_TIMEOUT: ${{ inputs.http_timeout }}
      run: |
        set -euo pipefail
        cfg_flags=(--global-config "${GH_GLOBAL_CFG}")
        case "${GH_USE_GLOBAL_CFG}" in
          auto|'') ;;
          true)  cfg_flags+=(--use-global-config) ;;
          false) cfg_flags+=(--no-global-config) ;;
          *)
            echo "::error::use_global_config must be 'auto', 'true', or 'false'" >&2
            exit 2
            ;;
        esac
        case "${GH_USE_MARKETPLACE_CFG}" in
          true|'') ;;
          false) cfg_flags+=(--no-marketplace-config) ;;
          *)
            echo "::error::use_marketplace_config must be 'true' or 'false'" >&2
            exit 2
            ;;
        esac
        [[ -n "${GH_CFG}" ]] && cfg_flags+=(--config "${GH_CFG}")

        # Always write the SARIF even on failure so the merge step
        # has it for upload. Stderr is tee'd to a sidecar file so a
        # config/auth-time failure (which produces no SARIF at all)
        # still surfaces in the job summary instead of silently
        # reading as "skipped" — see the summary step below.
        ERROR_LOG="${GITHUB_WORKSPACE}/bos-scan-posture-error.log"
        rm -f "${ERROR_LOG}"
        set +e
        bos-scan posture \
          --owner  "${GH_OWNER}" \
          --repo   "${GH_REPO}" \
          --token  "${GH_TOKEN}" \
          --root   "${GITHUB_WORKSPACE}" \
          --sarif  "${GITHUB_WORKSPACE}/bos-scan-posture.sarif" \
          --skips-json "${GITHUB_WORKSPACE}/bos-scan-posture-skips.json" \
          --recommendations-json "${GITHUB_WORKSPACE}/bos-scan-recommendations.json" \
          --fail-on "${FAIL_ON}" \
          --http-timeout "${HTTP_TIMEOUT}" \
          "${cfg_flags[@]}" \
          2> >(tee "${ERROR_LOG}" >&2)
        ec=$?
        set -e

        # Record failure count for the workflow output. The CLI's own
        # exit code already encodes this; the count is informational.
        # JSON-parse the SARIF so whitespace/quote-style in the file
        # cannot skew the count (the prior `grep -c '"level": "error"'`
        # was brittle against compact-formatted SARIF).
        if [[ -f "${GITHUB_WORKSPACE}/bos-scan-posture.sarif" ]]; then
          fails=$(python3 - <<'PY' "${GITHUB_WORKSPACE}/bos-scan-posture.sarif"
        import json, sys
        try:
            d = json.load(open(sys.argv[1]))
        except Exception:
            print(0); sys.exit(0)
        print(sum(1 for r in d.get("runs", [])
                  for x in r.get("results", [])
                  if x.get("level") == "error"))
        PY
        )
        else
          fails=0
        fi
        echo "failures=${fails}" >> "${GITHUB_OUTPUT}"
        echo "recommendations_path=${GITHUB_WORKSPACE}/bos-scan-recommendations.json" >> "${GITHUB_OUTPUT}"

        # Defer hard failure to the merge step so SARIF still uploads.
        # We record the exit code as a step output instead.
        echo "exit_code=${ec}" >> "${GITHUB_OUTPUT}"

    # ----- 3a. actionlint (workflow YAML) -------------------------------
    - id: actionlint
      name: actionlint (GitHub workflow YAML)
      if: inputs.enable_scanners == 'true' && hashFiles('.github/workflows/*.yml', '.github/workflows/*.yaml') != ''
      shell: bash
      run: |
        set -euo pipefail
        # Install actionlint (single static binary; ~1MB).
        # Branch on RUNNER_ARCH so this works on both x64 and ARM64
        # GitHub-hosted runners.
        AL_VERSION=1.7.1
        case "${RUNNER_ARCH:-X64}" in
          X64)   al_arch=amd64 ;;
          ARM64) al_arch=arm64 ;;
          *)
            echo "::warning::unsupported RUNNER_ARCH=${RUNNER_ARCH}; defaulting to amd64"
            al_arch=amd64
            ;;
        esac
        AL_TARBALL="actionlint_${AL_VERSION}_linux_${al_arch}.tar.gz"
        download_exit=0
        if ! curl -sSLo /tmp/actionlint.tar.gz \
          "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/${AL_TARBALL}"; then
          download_exit=1
        fi
        if [[ "${download_exit}" -eq 0 ]]; then
          if ! tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint; then
            download_exit=1
          fi
        fi
        # Run with SARIF output (actionlint has built-in SARIF since v1.7).
        # `|| true` because we collect findings even on non-zero so the
        # merge step always runs.
        if [[ "${download_exit}" -eq 0 ]]; then
          /tmp/actionlint -format '{{sarif .}}' \
            > "${GITHUB_WORKSPACE}/bos-scan-actionlint.sarif" 2>/dev/null || true
        fi
        # If the template isn't supported in this version, fall back to
        # a minimal empty SARIF so the merge step doesn't break. Record
        # this as an execution failure so the summary cannot call it clean.
        if ! head -c1 "${GITHUB_WORKSPACE}/bos-scan-actionlint.sarif" | grep -q '{'; then
          printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"actionlint"}}, "results":[]}]}\n' \
            > "${GITHUB_WORKSPACE}/bos-scan-actionlint.sarif"
          download_exit=1
        fi
        echo "exit_code=${download_exit}" >> "${GITHUB_OUTPUT}"

    # ----- 3b. gitleaks (secrets) ---------------------------------------
    - id: gitleaks
      name: gitleaks (secret scan)
      if: inputs.enable_scanners == 'true'
      shell: bash
      run: |
        set -euo pipefail
        GL_VERSION=8.21.2
        case "${RUNNER_ARCH:-X64}" in
          X64)   gl_arch=x64 ;;
          ARM64) gl_arch=arm64 ;;
          *)
            echo "::warning::unsupported RUNNER_ARCH=${RUNNER_ARCH}; defaulting to x64"
            gl_arch=x64
            ;;
        esac
        download_exit=0
        if ! curl -sSLo /tmp/gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_${gl_arch}.tar.gz"; then
          download_exit=1
        fi
        if [[ "${download_exit}" -eq 0 ]]; then
          if ! tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks; then
            download_exit=1
          fi
        fi
        if [[ "${download_exit}" -eq 0 ]]; then
          if ! chmod +x /tmp/gitleaks; then
            download_exit=1
          fi
        fi
        # `detect` over the working tree — no `--no-git` so historical
        # blobs are scanned where available.
        if [[ "${download_exit}" -eq 0 ]]; then
          /tmp/gitleaks detect \
            --source "${GITHUB_WORKSPACE}" \
            --report-format sarif \
            --report-path  "${GITHUB_WORKSPACE}/bos-scan-gitleaks.sarif" \
            --no-banner --exit-code 0 || download_exit=$?
        fi
        # Guarantee a SARIF file exists while preserving the failed
        # execution state for the deferred enforcement step.
        if [[ ! -s "${GITHUB_WORKSPACE}/bos-scan-gitleaks.sarif" ]]; then
          printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"gitleaks"}}, "results":[]}]}\n' \
            > "${GITHUB_WORKSPACE}/bos-scan-gitleaks.sarif"
          download_exit=1
        fi
        echo "exit_code=${download_exit}" >> "${GITHUB_OUTPUT}"

    # ----- 3c. shellcheck (only if shell scripts detected) --------------
    - id: shellcheck
      name: shellcheck (shell scripts)
      if: inputs.enable_scanners == 'true' && hashFiles('**/*.sh', '**/*.bash') != ''
      shell: bash
      run: |
        set -euo pipefail
        # Pinned static binary — avoids `sudo apt-get` (which fails on
        # minimal / self-hosted / non-Debian runners) and matches the
        # pinning strategy used for actionlint and gitleaks above.
        SC_VERSION=0.10.0
        case "${RUNNER_ARCH:-X64}" in
          X64)   sc_arch=x86_64 ;;
          ARM64) sc_arch=aarch64 ;;
          *)
            echo "::warning::unsupported RUNNER_ARCH=${RUNNER_ARCH}; defaulting to x86_64"
            sc_arch=x86_64
            ;;
        esac
        download_exit=0
        if ! curl -sSLo /tmp/shellcheck.tar.xz \
          "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.${sc_arch}.tar.xz"; then
          download_exit=1
        fi
        # Extract via Python's stdlib `lzma` + `tarfile` rather than
        # `tar -xJf`. The shellcheck release tarballs are only published
        # in `.tar.xz` form, and minimal / self-hosted runners (e.g.
        # our own `docker-github-runner` image) do not ship the
        # `xz` binary by default — `tar -xJf` then fails with
        # `xz: Cannot exec: No such file or directory` (exit 2).
        # CPython always bundles `lzma`, so this works anywhere
        # `python3` is on PATH — which the SARIF-conversion block
        # further down already requires. Honors the explicit
        # "avoids `sudo apt-get` ... fails on minimal / self-hosted
        # / non-Debian runners" design intent stated above.
        if [[ "${download_exit}" -eq 0 ]]; then
        if ! python3 - <<'PY'
        import tarfile
        with tarfile.open("/tmp/shellcheck.tar.xz", "r:xz") as tf:
            try:
                # PEP 706 (Python 3.12+) — opt into the strict `data`
                # filter explicitly. Avoids the DeprecationWarning on
                # 3.12/3.13 and the hard error on 3.14+ when no filter
                # is supplied to `extractall`.
                tf.extractall("/tmp", filter="data")
            except TypeError:
                # Python <3.12 has no `filter` kwarg. Vendor binary
                # release from a pinned tag — safe to extract as-is.
                tf.extractall("/tmp")
        PY
          download_exit=1
        fi
        fi
        SHELLCHECK="/tmp/shellcheck-v${SC_VERSION}/shellcheck"
        if [[ "${download_exit}" -eq 0 ]]; then
          if ! chmod +x "${SHELLCHECK}"; then
            download_exit=1
          fi
        fi
        # Collect findings as JSON, then convert to SARIF via a tiny
        # Python helper (keeps us free of extra dependencies).
        cd "${GITHUB_WORKSPACE}"
        if [[ "${download_exit}" -eq 0 ]]; then
          set +e
          find . -type f \( -name '*.sh' -o -name '*.bash' \) \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './vendor/*' \
            -print0 \
            | xargs -0 -r "${SHELLCHECK}" -f json 2>/dev/null > /tmp/shellcheck.json
          scan_exit=${PIPESTATUS[1]}
          set -e
          # Exit 1 denotes ordinary ShellCheck findings. Larger values
          # mean the tool could not execute or process its input.
          if [[ "${scan_exit}" -gt 1 ]]; then
            download_exit="${scan_exit}"
          fi
        fi
        python3 - <<'PY'
        import json
        import pathlib
        src = pathlib.Path("/tmp/shellcheck.json")
        try:
            findings = json.loads(src.read_text() or "[]")
        except Exception:
            findings = []
        level_map = {"error": "error", "warning": "warning",
                     "info": "note", "style": "note"}
        results = []
        rules = {}
        for f in findings:
            rid = f"SC{f.get('code', 0)}"
            rules.setdefault(rid, f.get("message", rid))
            results.append({
                "ruleId": rid,
                "level": level_map.get(f.get("level", "warning"), "warning"),
                "message": {"text": f.get("message", "")},
                "locations": [{
                    "physicalLocation": {
                        "artifactLocation": {"uri": f.get("file", "")},
                        "region": {
                            "startLine": f.get("line", 1),
                            "startColumn": f.get("column", 1),
                        },
                    }
                }],
            })
        sarif = {
            "version": "2.1.0",
            "runs": [{
                "tool": {"driver": {
                    "name": "shellcheck",
                    "rules": [{"id": rid, "name": rid,
                               "shortDescription": {"text": txt}}
                              for rid, txt in sorted(rules.items())],
                }},
                "results": results,
            }],
        }
        pathlib.Path("bos-scan-shellcheck.sarif").write_text(
            json.dumps(sarif, indent=2) + "\n")
        PY
        if [[ "${download_exit}" -ne 0 ]]; then
          echo "exit_code=${download_exit}" >> "${GITHUB_OUTPUT}"
        else
          echo "exit_code=0" >> "${GITHUB_OUTPUT}"
        fi

    # ----- 4. Merge every available SARIF into one upload artefact ------
    - id: merge
      name: Merge SARIF
      if: always()
      shell: bash
      env:
        OUTPUT: ${{ inputs.sarif_output }}
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}"
        inputs=()
        for f in bos-scan-actionlint.sarif bos-scan-gitleaks.sarif bos-scan-shellcheck.sarif; do
          if [[ -s "${f}" ]]; then
            inputs+=(--input "${f}")
          fi
        done
        posture_flag=()
        if [[ -s bos-scan-posture.sarif ]]; then
          posture_flag=(--posture bos-scan-posture.sarif)
        fi
        bos-scan sarif \
          "${inputs[@]}" \
          "${posture_flag[@]}" \
          --output "${OUTPUT}"
        echo "sarif_path=${OUTPUT}" >> "${GITHUB_OUTPUT}"

    # ----- 5. Upload to GitHub Advanced Security ------------------------
    # SHA pin per Marketplace SC002 hygiene; bump via Dependabot.
    - name: Upload SARIF to GitHub Advanced Security
      if: always() && inputs.enable_upload == 'true' && steps.merge.outcome == 'success'
      uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
      with:
        sarif_file: ${{ steps.merge.outputs.sarif_path }}
        category: ${{ inputs.category }}

    # ----- 6. Build job summary + compute outcome ----------------------
    # Severity-aware verdict for the run, surfaced both as a
    # GitHub Actions step-summary table (renders on the run page) AND
    # as the `outcome` step output (consumed by the caller workflow to
    # gate downstream jobs without re-parsing SARIF). Tiers:
    #   success  → 0 findings of any level
    #   warn     → only warning/note-level findings
    #   failure  → at least one error-level finding
    # The enforcement step that follows uses this output instead of
    # re-counting SARIF results, so summary table + exit code can never
    # disagree.
    - id: summary
      name: Summary + outcome
      if: always()
      shell: bash
      env:
        ENABLE_POSTURE: ${{ inputs.enable_posture }}
        ENABLE_SCANNERS: ${{ inputs.enable_scanners }}
        ENABLE_UPLOAD: ${{ inputs.enable_upload }}
        CATEGORY: ${{ inputs.category }}
        FAIL_ON: ${{ inputs.fail_on }}
        TOKEN_INPUT_SUPPLIED: ${{ inputs.github_token != '' && 'true' || 'false' }}
        SARIF_PATH: ${{ steps.merge.outputs.sarif_path }}
        POSTURE_EXIT_CODE: ${{ steps.posture.outputs.exit_code }}
        ACTIONLINT_EXIT_CODE: ${{ steps.actionlint.outputs.exit_code }}
        GITLEAKS_EXIT_CODE: ${{ steps.gitleaks.outputs.exit_code }}
        SHELLCHECK_EXIT_CODE: ${{ steps.shellcheck.outputs.exit_code }}
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
        CONFIG_PATH: ${{ inputs.config }}
        GLOBAL_CONFIG_PATH: ${{ inputs.global_config_path }}
        USE_GLOBAL_CONFIG: ${{ inputs.use_global_config }}
        USE_MARKETPLACE_CONFIG: ${{ inputs.use_marketplace_config }}
        HTTP_TIMEOUT: ${{ inputs.http_timeout }}
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}"
        python3 - <<'PY'
        import importlib.util, json, os, pathlib, sys

        from ai import detect_provider, summarize as summarize_with_ai

        action_config_path = pathlib.Path(os.environ["GITHUB_ACTION_PATH"]) / "src" / "config.py"
        config_spec = importlib.util.spec_from_file_location("bos_code_scanning_config", action_config_path)
        if config_spec is None or config_spec.loader is None:
          raise RuntimeError(f"Unable to load code-scanning config module: {action_config_path}")
        config_module = importlib.util.module_from_spec(config_spec)
        sys.modules["bos_code_scanning_config"] = config_module
        config_spec.loader.exec_module(config_module)
        resolve_config = config_module.resolve

        import redaction as redaction_module

        # Default-on, so a later config-resolution failure still redacts.
        redactor = redaction_module.build()

        def md_escape(value):
            return str(value).replace("|", "\\|").replace("\n", " ")

        def enabled(value):
            return "enabled" if str(value).lower() == "true" else "disabled"

        def result_location(result):
          locations = result.get("locations") or []
          if not locations:
            return "—"
          loc = locations[0]
          physical = loc.get("physicalLocation") or {}
          artifact = physical.get("artifactLocation") or {}
          uri = artifact.get("uri") or ""
          region = physical.get("region") or {}
          line = region.get("startLine")
          logical = loc.get("logicalLocations") or []
          if uri and line:
            return f"{uri}:{line}"
          if uri:
            return uri
          if logical:
            return logical[0].get("name") or "—"
          return "—"

        def recommendation_for(source, result, rule_help=""):
          rule_id = result.get("ruleId") or ""
          if source == "Posture audit":
            return rule_help or "Review the posture finding and apply the configured repository control."
          if source == "actionlint":
            return "Fix the workflow syntax/expression issue reported by actionlint."
          if source == "gitleaks":
            return "Rotate the exposed secret, remove it from history if needed, and add a safe secret-management path."
          if source == "shellcheck":
            return "Review the ShellCheck finding and update the shell script for safer quoting, flow control, or portability."
          return rule_help or f"Review `{rule_id}` in the SARIF/code-scanning alert and apply the tool recommendation."

        def sarif_results(source, path):
          p = pathlib.Path(path)
          if not p.exists() or p.stat().st_size == 0:
            return []
          try:
            doc = json.loads(p.read_text())
          except Exception:
            return []
          rows = []
          for run in doc.get("runs", []):
            rules = {
              rule.get("id"): (
                (rule.get("shortDescription") or {}).get("text")
                or (rule.get("fullDescription") or {}).get("text")
                or ""
              )
              for rule in (run.get("tool", {}).get("driver", {}).get("rules") or [])
            }
            for result in run.get("results", []):
              rule_id = result.get("ruleId") or "unknown"
              message = (result.get("message") or {}).get("text") or "No message provided."
              level = result.get("level") or "warning"
              rows.append({
                "source": source,
                "rule_id": rule_id,
                "severity": level,
                "location": result_location(result),
                "message": message,
                "recommendation": recommendation_for(source, result, rules.get(rule_id, "")),
              })
          return rows

        scanners = [
          ("Posture audit", "bos-scan-posture.sarif",    os.environ.get("ENABLE_POSTURE")  == "true", os.environ.get("POSTURE_EXIT_CODE", "")),
          ("actionlint",    "bos-scan-actionlint.sarif", os.environ.get("ENABLE_SCANNERS") == "true", os.environ.get("ACTIONLINT_EXIT_CODE", "")),
          ("gitleaks",      "bos-scan-gitleaks.sarif",   os.environ.get("ENABLE_SCANNERS") == "true", os.environ.get("GITLEAKS_EXIT_CODE", "")),
          ("shellcheck",    "bos-scan-shellcheck.sarif", os.environ.get("ENABLE_SCANNERS") == "true", os.environ.get("SHELLCHECK_EXIT_CODE", "")),
        ]

        def counts(path):
            e = w = n = 0
            try:
                d = json.load(open(path))
            except Exception:
                return None
            for run in d.get("runs", []):
                for r in run.get("results", []):
                    lv = r.get("level", "warning")
                    if lv == "error":     e += 1
                    elif lv == "warning": w += 1
                    else:                 n += 1
            return (e, w, n)

        # Posture sidecar — SARIF drops `pass` and `skip` findings
        # (rightly, they are not actionable in the Security tab), so
        # this JSON sidecar carries the full posture evidence for the
        # all-up audit report.
        skips = []
        posture_findings = []
        skips_path = pathlib.Path("bos-scan-posture-skips.json")
        if skips_path.exists() and skips_path.stat().st_size > 0:
          try:
            posture_sidecar = json.loads(skips_path.read_text())
            skips = posture_sidecar.get("skips", []) or []
            posture_findings = posture_sidecar.get("findings", []) or []
          except Exception:
            skips = []
            posture_findings = []

        rows = []
        any_err = any_find = False
        posture_config_error = None
        posture_exit_code = os.environ.get("POSTURE_EXIT_CODE", "")
        if posture_exit_code not in ("", "0"):
          error_log = pathlib.Path("bos-scan-posture-error.log")
          if error_log.exists() and error_log.stat().st_size > 0:
            posture_config_error = error_log.read_text().strip().splitlines()[-1]
          else:
            posture_config_error = f"posture exited {posture_exit_code} with no captured error message"

        for label, name, scanner_enabled, scanner_exit_code in scanners:
            p = pathlib.Path(name)
            if not scanner_enabled:
                rows.append((label, "skipped", "stage disabled"))
                continue
            if label == "Posture audit" and posture_config_error:
                # A config/auth-time failure produces no SARIF at all — do
                # not let that read as "skipped"; it must fail the run so
                # a broken posture audit can never be mistaken for a clean
                # bill of health.
                rows.append((label, "failure", posture_config_error))
                any_err = True
                any_find = True
                continue
              if label != "Posture audit" and scanner_exit_code not in ("", "0"):
                  rows.append((label, "failure", f"scanner setup or execution failed (exit {scanner_exit_code})"))
                  any_err = True
                  any_find = True
                  continue
            if not p.exists() or p.stat().st_size == 0:
                rows.append((label, "skipped", "no SARIF produced"))
                continue
            c = counts(p)
            if c is None:
                rows.append((label, "warn", "SARIF unreadable"))
              any_find = True
                continue
            e, w, n = c
            if e:
                rows.append((label, "failure", f"{e} error / {w} warn / {n} note"))
                any_err = True
                any_find = True
            elif w + n:
                rows.append((label, "warn", f"{w} warn / {n} note"))
                any_find = True
            elif label == "Posture audit" and skips:
                # Posture ran cleanly on the rules it could evaluate,
                # but one or more probes were skipped (typically a
                # token-scope limit). Surface as `incomplete` rather
                # than `success` so the verdict line stays honest.
                rows.append((label, "incomplete",
                             f"{len(skips)} probe(s) indeterminate — see below"))
            else:
                rows.append((label, "success", "no findings"))

        # Outcome rollup. Skips never produce errors, but they DO
        # demote a would-be `success` to `warn` so the top-line badge
        # doesn't lie. They never override an existing `failure`/`warn`.
        if   any_err:           outcome = "failure"
        elif any_find:          outcome = "warn"
        elif skips:             outcome = "warn"
        else:                   outcome = "success"

        badge = {"success": "success", "warn": "warn", "failure": "failure"}[outcome]
        fail_on = os.environ.get("FAIL_ON", "fail")
        if outcome == "failure" and fail_on != "never":
            verdict = ("Pipeline will fail. Override via `fail_on: never` on the "
                       "kit (advisory mode) or `security_scan_blocks_release: false` "
                       "on the launchpad (run scan but do not gate release).")
        elif outcome == "failure":
            verdict = "Error-level findings present, but `fail_on: never` — pipeline continues."
        elif outcome == "warn" and any_find:
            verdict = "Non-blocking findings present — pipeline continues."
        elif outcome == "warn" and skips:
            verdict = (f"No findings, but {len(skips)} probe(s) could not be "
                       "evaluated (see 'Indeterminate / skipped probes' below). "
                       "Provide an elevated PAT to upgrade them to pass/fail.")
        else:
            verdict = "No findings detected."

        token_supplied = os.environ.get("TOKEN_INPUT_SUPPLIED") == "true"
        if not os.environ.get("ENABLE_POSTURE") == "true":
            token_mode = "not used"
            token_capability = "Posture audit disabled; no GitHub posture APIs queried."
        elif token_supplied:
            token_mode = "github_token input supplied"
            token_capability = (
                "Full posture coverage if the supplied token has the required repository permissions; "
                "check skipped probes below for any missing access."
            )
        else:
            token_mode = "workflow GITHUB_TOKEN fallback"
            token_capability = (
                "Baseline coverage. Admin-gated controls such as secret scanning, Dependabot alerts, "
                "and branch protection may report as skipped."
            )

        if skips:
            observed_coverage = f"limited: {len(skips)} admin-gated probe(s) were not assessed"
        elif os.environ.get("ENABLE_POSTURE") == "true":
            observed_coverage = "no skipped posture probes observed in this run"
        else:
            observed_coverage = "not applicable"

        upload_enabled = os.environ.get("ENABLE_UPLOAD") == "true"
        sarif_path = os.environ.get("SARIF_PATH") or "not produced"
        config_rows = [
          ("Posture audit", enabled(os.environ.get("ENABLE_POSTURE")),
           "Checks GitHub security settings, workflows, branch protection, and CODEOWNERS."),
          ("Bundled scanners", enabled(os.environ.get("ENABLE_SCANNERS")),
           "Runs actionlint, gitleaks, and shellcheck when matching files are present."),
          ("SARIF upload", enabled(os.environ.get("ENABLE_UPLOAD")),
           f"{'Uploads' if upload_enabled else 'Does not upload'} merged findings to Code scanning category "
           f"`{os.environ.get('CATEGORY') or 'bos-code-scanning-kit'}`; path: `{sarif_path}`."),
            ("Failure policy", f"`{fail_on}`", "`fail` blocks on failure findings; `never` keeps the run advisory."),
            ("Token mode", token_mode, token_capability),
            ("Observed posture coverage", observed_coverage, "Use a GitHub App installation token if admin-gated checks are skipped; `SCANNING_PAT` is a legacy fallback."),
        ]

        all_annotations = []
        for source, sarif_name, stage_enabled, _scanner_exit_code in scanners:
            if stage_enabled:
                all_annotations.extend(sarif_results(source, sarif_name))

        scanner_annotations = [r for r in all_annotations if r["source"] != "Posture audit"]
        annotation_counts = {
          "error": sum(r["severity"] == "error" for r in scanner_annotations),
          "warning": sum(r["severity"] in ("warning", "warn") for r in scanner_annotations),
          "notice": sum(r["severity"] in ("note", "notice") for r in scanner_annotations),
        }
        posture_attention = [f for f in posture_findings if f.get("severity") not in ("pass", "skip")]
        posture_passed = [f for f in posture_findings if f.get("severity") == "pass"]
        posture_skipped = [f for f in posture_findings if f.get("severity") == "skip"]
        attention_rows = []
        for finding in posture_attention:
            attention_rows.append({
                "source": "Posture audit",
                "rule_id": finding.get("rule_id", "unknown"),
                "severity": finding.get("severity", "warn"),
                "location": finding.get("location") or "repository",
                "message": finding.get("message") or "No message provided.",
                "recommendation": finding.get("remediation") or "Review and remediate this posture control.",
            })
        attention_rows.extend(all_annotations)

        # AI is opportunistic: unavailable providers never fail the scan.
        ai_summary = None
        ai_status = "disabled"
        try:
          use_global = os.environ.get("USE_GLOBAL_CONFIG", "auto")
          use_global_value = {"true": True, "false": False}.get(use_global)
          use_marketplace_value = os.environ.get("USE_MARKETPLACE_CONFIG", "true") != "false"
          resolved_config = resolve_config(
            pathlib.Path.cwd(),
            config_path=os.environ.get("CONFIG_PATH") or None,
            global_config_path=os.environ.get("GLOBAL_CONFIG_PATH") or None,
            use_global_config=use_global_value,
            use_marketplace_config=use_marketplace_value,
          )
          redactor = redaction_module.build(
            enabled=resolved_config.redaction.enabled,
            placeholder=resolved_config.redaction.placeholder,
            extra_patterns=resolved_config.redaction.extra_patterns,
          )
          remediation = resolved_config.remediation
          if remediation.enable_ai_findings_summary:
            provider = detect_provider(remediation.ai_findings_summary_provider)
            if provider:
              ai_status = f"attempted ({provider.name})"
              ai_summary = summarize_with_ai(
                attention_rows,
                provider,
                timeout=int(os.environ.get("HTTP_TIMEOUT", "20")),
              )
              if ai_summary is None:
                ai_status = f"unavailable ({provider.name}); deterministic fallback"
            else:
              ai_status = "unavailable; deterministic fallback"
        except Exception as exc:
          ai_status = f"unavailable; deterministic fallback ({type(exc).__name__})"

        config_rows.append(
          ("AI triage summary", ai_status,
           "Uses GitHub Models when available; configure or disable it in layered remediation settings.")
        )
        config_rows.append(
          ("Report redaction", "enabled" if redactor.enabled else "disabled",
           "Credential-shaped text in logs, summaries, and uploaded reports is replaced with a placeholder. "
           "SARIF keeps full fidelity for the permission-gated Security tab.")
        )

        # Redact every publicly readable surface. SARIF is deliberately
        # excluded: it lands in code scanning, which is permission gated.
        if redactor.enabled:
          rows = [(label, result, redactor.redact(detail)) for label, result, detail in rows]
          for collection in (all_annotations, scanner_annotations, attention_rows):
            for entry in collection:
              entry["message"] = redactor.redact(entry.get("message", ""))
              entry["recommendation"] = redactor.redact(entry.get("recommendation", ""))
          for bucket in (posture_passed, posture_skipped):
            for entry in bucket:
              entry["message"] = redactor.redact(entry.get("message", ""))
          for skip_entry in skips:
            skip_entry["message"] = redactor.redact(skip_entry.get("message", ""))
          verdict = redactor.redact(verdict)
          if ai_summary:
            ai_summary = redactor.redact(ai_summary)

        report_recommendations = []
        if any(r["severity"] in ("error", "fail") for r in attention_rows) or any(r["severity"] == "error" for r in all_annotations):
            report_recommendations.append("Prioritize High/Critical rows before treating this repository as compliant.")
        if scanner_annotations:
            report_recommendations.append("Review scanner annotations in the SARIF upload and either remediate or document accepted risk.")
        if skips:
            report_recommendations.append("Install the GitHub App with the required read scopes to convert Not Assessed posture checks into evidence-backed pass/warn/fail results. `SCANNING_PAT` is a legacy fallback.")
        if not report_recommendations:
            report_recommendations.append("No immediate remediation is required by the configured controls; keep this report with the release evidence trail.")

        def write_table(fh, headers, records, row_fn, empty):
            if not records:
                fh.write(f"_{empty}_\n")
                return
            fh.write("| " + " | ".join(headers) + " |\n")
            fh.write("|" + "|".join("---" for _ in headers) + "|\n")
            for record in records:
                fh.write("| " + " | ".join(md_escape(value) for value in row_fn(record)) + " |\n")

        severity_badge = {
            "pass": "✅",
            "warn": "⚠️",
            "fail": "🔴",
            "error": "🔥",
            "skip": "⚪",
            "warning": "⚠️",
            "note": "ℹ️",
        }
        result_badge = {
            "success": "✅",
            "warn": "⚠️",
            "failure": "🔴",
            "incomplete": "⚪",
            "skipped": "➖",
        }

        # ─── Console echo ────────────────────────────────────────────
        # Mirror the per-stage table + outcome to the runner log too.
        # GitHub Actions renders ANSI sequences verbatim, so colour the
        # outcome badge and per-stage result for at-a-glance triage.
        sev_color = {
            "success":    "\033[32m",     # green
            "warn":       "\033[33m",     # yellow
            "failure":    "\033[31;1m",   # bold red
            "skipped":    "\033[90m",     # grey  — stage disabled / no SARIF
            "incomplete": "\033[33m",     # yellow — ran but indeterminate probes
        }
        reset = "\033[0m"
        bold  = "\033[1m"
        label_w = max(len(label) for label, _, _ in rows)
        res_w   = max(len(res)   for _, res, _ in rows)
        print()
        print(f"{bold}━━ Blackout Secure Code Scanning Kit — outcome: "
              f"{sev_color.get(outcome, '')}{outcome}{reset}{bold} ━━{reset}")
        for label, res, detail in rows:
            colour = sev_color.get(res, "")
            print(f"  {label.ljust(label_w)}  "
                  f"{colour}{res.ljust(res_w)}{reset}  {detail}")
        if skips:
            print()
            print(f"  {bold}indeterminate probes{reset} "
                  f"({len(skips)} — token-scope limitations):")
            for s in skips:
                rid = s.get("rule_id", "?")
                msg = s.get("message", "")
                print(f"    • {rid}: {msg}")
        print()
        print(f"  {bold}configuration{reset}:")
        for setting, value, _ in config_rows:
            print(f"    {setting}: {value}")
        print(f"  {bold}verdict{reset}: {verdict}")
        if ai_summary:
          print(f"  {bold}AI triage summary{reset}:\n{ai_summary}")
        print()

        summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary:
            with open(summary, "a", encoding="utf-8") as fh:
                fh.write(f"# Blackout Code Scanning Audit Report — {badge}\n\n")
                fh.write("**Provided by [Blackout Secure](https://blackoutsecure.app)**\n\n")
                fh.write("## Navigation\n\n")
                fh.write("- [Executive summary](#executive-summary)\n")
                fh.write("- [Configuration used](#configuration-used)\n")
                fh.write("- [Findings requiring attention](#findings-requiring-attention)\n")
                fh.write("- [Scanner annotations](#scanner-annotations)\n")
                fh.write("- [Passed posture controls](#passed-posture-controls)\n")
                fh.write("- [Not assessed checks](#not-assessed-checks)\n")
                fh.write("- [Recommendations](#recommendations)\n")
                fh.write("- [SARIF upload](#sarif-upload)\n\n")
                fh.write("## Executive summary\n\n")
                fh.write("| Stage | Result | Findings |\n")
                fh.write("|---|---|---|\n")
                for label, result, detail in rows:
                  badge = result_badge.get(result, "ℹ️")
                  fh.write(f"| {label} | {badge} **{result}** | {detail} |\n")
                fh.write(
                  f"\n**Annotation assessment:** 🔴 {annotation_counts['error']} errors · "
                  f"⚠️ {annotation_counts['warning']} warnings · "
                  f"ℹ️ {annotation_counts['notice']} notices. "
                  "Scanner annotations are included below and contribute to the owning stage result; "
                  "GitHub runtime annotations remain linked from the Actions run.\n"
                )
                fh.write(f"\n**Outcome:** `{outcome}` — {verdict}\n")
                if ai_summary:
                  fh.write("\n### AI triage summary\n\n")
                  fh.write(ai_summary + "\n")

                fh.write("\n### Configuration used\n\n")
                fh.write("| Setting | Value | What it means |\n")
                fh.write("|---|---|---|\n")
                for setting, value, meaning in config_rows:
                    fh.write(
                        f"| {md_escape(setting)} | {md_escape(value)} | {md_escape(meaning)} |\n"
                    )

                fh.write("\n### Findings requiring attention\n\n")
                write_table(
                    fh,
                  ["Source", "Rule", "Severity", "Scope / location", "Evidence", "Recommended remediation"],
                    attention_rows,
                    lambda r: [r["source"], f"`{r['rule_id']}`", f"{severity_badge.get(r['severity'], 'ℹ️')} **{r['severity']}**", r["location"], r["message"], r["recommendation"]],
                    "No failing, warning, or scanner annotation rows were found.",
                )

                fh.write("\n<details>\n<summary>Scanner annotations</summary>\n\n")
                write_table(
                    fh,
                    ["Tool", "Rule", "Severity", "Location", "Annotation", "Recommended remediation"],
                    scanner_annotations,
                    lambda r: [r["source"], f"`{r['rule_id']}`", f"{severity_badge.get(r['severity'], 'ℹ️')} **{r['severity']}**", r["location"], r["message"], r["recommendation"]],
                    "No scanner annotations were emitted by actionlint, gitleaks, or shellcheck.",
                )
                fh.write("\n</details>\n")

                fh.write("\n<details open>\n<summary>Passed posture controls</summary>\n\n")
                write_table(
                    fh,
                  ["Rule", "Scope", "Control", "Evidence"],
                    posture_passed,
                  lambda f: [f"`{f.get('rule_id', 'unknown')}`", f.get("location") or "repository", f.get("title") or "Control passed", f.get("message") or "Passed."],
                    "No passed posture controls were recorded. If posture was disabled, enable it to collect pass evidence.",
                )
                fh.write("\n</details>\n")

                if skips:
                    fh.write("\n### Not assessed checks\n\n")
                    fh.write(
                        "These checks ran but could not reach a `pass` or "
                        "`fail` verdict — typically the GitHub token lacks "
                        "the scope to query an admin-gated endpoint. They "
                        "are shown here (not as failures) so reviewers know "
                        "what was *not* audited.\n\n"
                    )
                    fh.write("| Rule | Reason | Scope |\n")
                    fh.write("|---|---|---|\n")
                    for s in skips:
                        rid = s.get("rule_id", "?")
                        msg = (s.get("message") or "").replace("|", "\\|")
                        loc = (s.get("location") or "repository").replace("|", "\\|")
                        fh.write(f"| `{rid}` | {msg} | {loc} |\n")
                elif posture_skipped:
                    fh.write("\n### Not assessed checks\n\n")
                    write_table(
                        fh,
                      ["Rule", "Scope", "Reason"],
                        posture_skipped,
                      lambda f: [f"`{f.get('rule_id', 'unknown')}`", f.get("location") or "repository", f.get("message") or "Skipped."],
                        "No posture checks were skipped.",
                    )
                else:
                    fh.write("\n### Not assessed checks\n\n")
                    fh.write("_No posture checks were skipped._\n")

                if skips:
                    fh.write("\n#### How to unlock full posture checks\n\n")
                    fh.write(
                        "Skipped rows mean the default `GITHUB_TOKEN` could not "
                        "read an admin-protected GitHub setting. To turn these "
                        "rows into real `pass`, `warn`, or `fail` results:\n\n"
                    )
                    fh.write(
                        "1. Install a GitHub App with the required read permissions "
                        "for the repository.\n"
                    )
                    fh.write(
                        "2. Mint an installation token in the calling workflow and "
                        "pass it through `github_token`.\n"
                    )
                    fh.write(
                        "3. If an App cannot be installed, use a scoped `SCANNING_PAT` "
                        "as the legacy fallback.\n\n"
                    )
                    fh.write(
                        "Follow the credential guidance in the "
                        "[Blackout Secure Code Scanning Kit README]"
                        "(https://github.com/blackoutsecure/bos-code-scanning-kit#github-app-preferred-and-scanning_pat-legacy-fallback--posture-credentials).\n"
                    )

                fh.write("\n### Recommendations\n\n")
                for recommendation in report_recommendations:
                    fh.write(f"- {recommendation}\n")

                if os.environ.get("ENABLE_UPLOAD") == "true" and os.environ.get("SARIF_PATH"):
                    fh.write("\n### SARIF upload\n\n")
                    fh.write(
                        "The merged SARIF report was uploaded to this repository's "
                        f"**Security** tab under the category `{os.environ.get('CATEGORY') or 'bos-code-scanning-kit'}`. "
                        "Open **Security → Code scanning alerts** to review, assign, "
                        "dismiss, or track the findings over time.\n"
                    )

        out = os.environ.get("GITHUB_OUTPUT")
        if out:
            with open(out, "a", encoding="utf-8") as fh:
                fh.write(f"outcome={outcome}\n")
        PY

    # ----- 7. Enforce failure policy (deferred from steps 2 + 3) -------
    # Hard-fails the action when the severity-tier `outcome` is
    # `failure` AND `fail_on` is not `never`. Deferring to the end of
    # the run keeps SARIF upload (step 5) and the job-summary table
    # (step 6) on the happy path even when the job is destined to fail,
    # so reviewers always have the merged findings + outcome table on
    # the run page.
    - name: Enforce failure policy
      if: always() && inputs.fail_on != 'never' && steps.summary.outputs.outcome == 'failure'
      shell: bash
      env:
        CATEGORY: ${{ inputs.category }}
      run: |
        echo "::error::bos-code-scanning-kit outcome=failure — at least one error-level finding. See the job summary and Security tab (category '${CATEGORY}') for details."
        echo "::error::Override with 'fail_on: never' (kit advisory mode) or 'security_scan_blocks_release: false' (launchpad)."
        exit 1
